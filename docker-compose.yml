services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noctua}
      POSTGRES_USER: ${POSTGRES_USER:-noctua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noctua_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noctua} -d ${POSTGRES_DB:-noctua}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-noctua}:${POSTGRES_PASSWORD:-noctua_local_password}@postgres:5432/${POSTGRES_DB:-noctua}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-noctua-internal-local}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-noctua-integration-local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-1234}
      ARCA_MODO: ${ARCA_MODO:-homologacion}
      ARCA_CUIT: ${ARCA_CUIT:-}
      ARCA_PUNTO_VENTA: ${ARCA_PUNTO_VENTA:-1}
      ARCA_CERTIFICATE_PATH: ${ARCA_CERTIFICATE_PATH:-}
      ARCA_PRIVATE_KEY_PATH: ${ARCA_PRIVATE_KEY_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
