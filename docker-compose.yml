services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noctua}
      POSTGRES_USER: ${POSTGRES_USER:-noctua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noctua} -d ${POSTGRES_DB:-noctua}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-noctua}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noctua}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET (32+ caracteres al azar) en el archivo .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Definí INTERNAL_API_KEY en el archivo .env}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Definí INTEGRATION_ENCRYPTION_KEY en el archivo .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Definí INITIAL_ADMIN_PASSWORD (10+ caracteres) en el archivo .env}
      ARCA_MODO: ${ARCA_MODO:-homologacion}
      ARCA_CUIT: ${ARCA_CUIT:-}
      ARCA_PUNTO_VENTA: ${ARCA_PUNTO_VENTA:-1}
      ARCA_CERTIFICATE_PATH: ${ARCA_CERTIFICATE_PATH:-}
      ARCA_PRIVATE_KEY_PATH: ${ARCA_PRIVATE_KEY_PATH:-}
      UPLOADS_DIR: /app/backend-reservas/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    volumes:
      - uploads_data:/app/backend-reservas/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
