name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
jobs:
  app:
    name: Tipos, pruebas y build de la app Expo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pruebas del backend (comprensión de texto, happy hour, IVA)
        run: npm ci && npm test
        working-directory: backend-reservas
      - name: Export web (valida el bundle que usan web y escritorio)
        run: npx expo export --platform web
        working-directory: apps/app
      - name: Export Android (valida el bundle Hermes)
        run: npx expo export --platform android
        working-directory: apps/app
